; ============================================================
;  AlienShooterCHS 配置
;  改完保存，重启游戏即生效（不需要重新编译 DLL）
;  本文件与 AlienShooterCHS.asi 放在同一目录（update\）
; ============================================================

[font]
; 字体文件：相对 update\ 目录。默认用本目录下的思源黑体（简繁+日韩）
file=SourceHanSansHWSC-VF.ttf

; 字体族名：留空 = 自动从 ttf 的 name 表读取真实族名（推荐留空）
; 例：face=Source Han Sans HW SC VF
face=

; 字形质量：0=不抗锯齿 1=DRAFT 2=PROOF 4=抗锯齿(默认，推荐) 5=ClearType
; ★ 填 0 会关掉抗锯齿：小字号笔画发毛、发虚、还可能拖慢，不建议
quality=4

; 字号补偿（**字体显小就是这个原因**）
;   GDI 的 lfHeight 是"字符单元格高度"，而字体自己声明的 usWinAscent+usWinDescent
;   占多少个 em 由字体决定：SimSun 恰好 = 1.0 em，思源黑体 = 1.448 em。
;   ⇒ 同一个 lfHeight 下思源黑体实际 em 只有 SimSun 的 69%，看似小一圈。
;   scale=0（默认）→ 自动按 (winAscent+winDescent)/unitsPerEm 补偿（思源=1.448）
;   手动微调填具体倍数，例如 1.30 / 1.55；填 1.0 = 完全不补偿
scale=0

[layout]
; ------------------------------------------------------------
; 文字位置微调（像素）。正数=右/下，负数=左/上。只影响我们画的中文。
; ------------------------------------------------------------
xoff=0
yoff=0

; 坐标映射模式：
;   0 = 自动（默认，推荐）
;   1 = 强制屏幕坐标（不套引擎矩阵）—— 某界面整体错位时可试
;   2 = 强制套引擎 WORLD*VIEW*PROJ 矩阵
mode=0

; ------------------------------------------------------------
; 排障开关（放文件即生效，删文件即恢复）
;   chs_off.txt      完全不接管（游戏恢复原样）
;   chs_utf8.txt     文本按 UTF-8 解释（默认 GBK）
;   chs_logall.txt   每个文本项都写日志（很吵）
;   chs_mapdiag.txt  记录坐标矩阵变化（排障坐标问题）
; ------------------------------------------------------------
